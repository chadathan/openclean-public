    <text x="36" y="223">≋</text><text x="62" y="223">Processes</text>
    <text x="36" y="279">✳</text><text x="62" y="279">Cleanup</text>
    <text x="36" y="335">▦</text><text x="62" y="335">Applications</text>
    <text x="36" y="391">▱</text><text x="62" y="391">File Manager</text>
    <text x="36" y="447">◇</text><text x="62" y="447">Privacy</text>
  </g>
  <text x="36" y="773" fill="#c9c9df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">⚙</text><text x="62" y="773" fill="#c9c9df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Settings</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
