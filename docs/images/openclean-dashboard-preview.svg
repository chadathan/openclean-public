    <g transform="translate(300 501)"><rect width="292" height="205" rx="20" fill="url(#card)" stroke="#fff"/><rect x="20" y="19" width="34" height="34" rx="11" fill="#eee6ff"/><text x="29" y="42" fill="#7044da" font-size="17">◈</text><text x="20" y="83" fill="#665d78" font-size="14" font-weight="600">GPU</text><text x="20" y="128" fill="#302b3d" font-size="37" font-weight="750">12%</text><text x="20" y="155" fill="#70677e" font-size="13">Integrated graphics</text><path d="M20 181 C50 176 63 180 90 166 S139 177 164 161 S204 165 231 154 S255 161 272 148" fill="none" stroke="#bb83e5" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(614 501)"><rect width="292" height="205" rx="20" fill="url(#card)" stroke="#fff"/><rect x="20" y="19" width="34" height="34" rx="11" fill="#fff0e1"/><text x="29" y="42" fill="#c6651e" font-size="17">ϟ</text><text x="20" y="83" fill="#665d78" font-size="14" font-weight="600">Battery</text><text x="20" y="128" fill="#302b3d" font-size="37" font-weight="750">86%</text><text x="20" y="155" fill="#70677e" font-size="13">On battery · 142 cycles</text><rect x="20" y="173" width="252" height="8" rx="4" fill="#e8e3ef"/><rect x="20" y="173" width="216" height="8" rx="4" fill="#8bcf9b"/></g>
    <g transform="translate(928 501)"><rect width="294" height="205" rx="20" fill="url(#card)" stroke="#fff"/><rect x="20" y="19" width="34" height="34" rx="11" fill="#e4f7f5"/><text x="29" y="42" fill="#4caeaa" font-size="17">↕</text><text x="20" y="83" fill="#665d78" font-size="14" font-weight="600">Network</text><text x="20" y="128" fill="#302b3d" font-size="37" font-weight="750">2.4 MB/s</text><text x="20" y="155" fill="#70677e" font-size="13">Current download speed</text><path d="M20 181h28v-8h27v8h24v-18h29v18h24v-10h27v10h26v-22h26v22h21" fill="none" stroke="#4caeaa" stroke-width="3" stroke-linejoin="round"/></g>
  </g>
  <rect x="906" y="759" width="316" height="30" rx="15" fill="#ffffffb8" stroke="#fff"/><text x="925" y="779" fill="#736b7d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Illustrative preview · sample metrics</text>
