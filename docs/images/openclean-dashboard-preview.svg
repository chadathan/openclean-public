<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">OpenClean dashboard preview</title>
  <desc id="desc">Illustrative OpenClean macOS dashboard showing system monitor cards for CPU, memory, storage, GPU, battery, and network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f5ff"/><stop offset=".52" stop-color="#eee9fb"/><stop offset="1" stop-color="#e0efff"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18152f"/><stop offset=".56" stop-color="#292052"/><stop offset="1" stop-color="#172d4d"/></linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9a76ff" stop-opacity=".48"/><stop offset="1" stop-color="#4ca9ff" stop-opacity=".24"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".97"/><stop offset="1" stop-color="#fff" stop-opacity=".72"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#44516b" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1280" height="820" rx="26" fill="#d6d5df"/>
  <rect x="2" y="2" width="1276" height="816" rx="25" fill="url(#bg)" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
  <circle cx="25" cy="22" r="6" fill="#ff6058"/><circle cx="45" cy="22" r="6" fill="#ffbd2e"/><circle cx="65" cy="22" r="6" fill="#28c840"/>
  <rect x="0" y="38" width="254" height="782" fill="url(#side)"/>
  <rect x="29" y="70" width="36" height="36" rx="11" fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".24"/>
  <path d="M39 91c5-12 13-14 19-13-1 8-5 15-15 17m6-5 8-8" fill="none" stroke="#c9b7ff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="77" y="94" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">OpenClean</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#c9c9df">
