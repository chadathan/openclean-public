    <text x="300" y="151" fill="#292638" font-size="34" font-weight="700">Monitor</text>
    <rect x="1030" y="117" width="194" height="42" rx="12" fill="#ffffffa8" stroke="#fff"/><text x="1052" y="144" fill="#6955b6" font-size="14" font-weight="600">⌁  View graph</text>
    <rect x="300" y="178" width="922" height="78" rx="18" fill="#f5f1ff" stroke="#e6defb"/>
    <rect x="320" y="195" width="44" height="44" rx="14" fill="#8f72f6"/><text x="334" y="225" fill="#fff" font-size="21">✦</text>
    <text x="382" y="209" fill="#302b3d" font-size="16" font-weight="700">Your Mac is running smoothly</text><text x="382" y="233" fill="#8f899f" font-size="13">System activity at a glance</text>
    <text x="1134" y="226" fill="#302b3d" font-size="25" font-weight="700">Good</text>
